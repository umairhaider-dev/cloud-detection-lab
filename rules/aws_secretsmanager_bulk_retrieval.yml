title: AWS Secrets Manager Bulk Secret Retrieval
id: d13977a7-7e65-4ba5-a9ce-99ba43fdb9aa
status: experimental
description: |
  Detects one identity reading 10 or more distinct secrets from Secrets Manager
  within 5 minutes. An attacker with stolen credentials often lists the secrets
  and then reads all of them at once to collect database passwords and API keys.
  Threshold and window: built from a live detonation, 20 secrets in 8 seconds.
  10 is half of that, so a smaller sweep is still caught, while normal
  applications read one or a few secrets at startup. 5 minutes allows for a
  slower script without adding up unrelated reads over a long period.
  Triage: Is the caller a known CI/IaC identity? Did a ListSecrets call come
  just before? The attack had one; Terraform did not. Which secrets were read,
  and should they be rotated?
  Known misses: BatchGetSecretValue, which returns many secrets in one call;
  reads spread over a longer time than the 5-minute window.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.credential-access.secretsmanager-retrieve-secrets/
  - https://attack.mitre.org/techniques/T1555/006/
author: Umair Haider
date: 2026-10-31
tags:
  - attack.credential-access
  - attack.t1555.006
correlation:
  type: value_count
  rules:
    - aws_secretsmanager_getsecretvalue_call
  group-by:
    - userIdentity.arn
  timespan: 5m
  condition:
    field: requestParameters.secretId
    gte: 10
falsepositives:
  - Infrastructure-as-code tools; Terraform reads every managed secret on apply and refresh (see known_fp.jsonl)
  - Application startup that loads many secrets at once
  - Secret rotation tooling
level: medium
