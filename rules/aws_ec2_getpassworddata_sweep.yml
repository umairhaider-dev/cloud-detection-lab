title: AWS EC2 GetPasswordData Call
id: c15b2412-5e95-4432-b4f2-ff7f16b6ffa7
name: aws_ec2_getpassworddata_call
status: experimental
description: |
  Base rule: one call to retrieve the encrypted Windows administrator password of an
  EC2 instance. A single call is often legitimate, so on its own this rule is
  informational. It feeds the sweep correlation below.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.credential-access.ec2-get-password-data/
author: Umair Haider
date: 2026-10-26
tags:
  - attack.credential-access
  - attack.t1552
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: ec2.amazonaws.com
    eventName: GetPasswordData
  condition: selection
falsepositives:
  - An administrator retrieving the password of a Windows instance they manage
level: informational
---
title: AWS EC2 GetPasswordData Sweep Across Many Instances
id: f57e72ca-f060-46eb-83c7-fde62c80ca2c
status: experimental
description: |
  Detects one identity requesting Windows password data for 5 or more distinct EC2
  instances within 2 minutes. An admin retrying on one instance produces many calls
  but a single instance ID, so it stays quiet; an attacker sweeping for credentials
  hits many instances and fires it. Built from a live Stratus Red Team detonation:
  30 calls in 9 seconds, all denied with Client.UnauthorizedOperation.
  Triage: check errorCode. A burst of denied calls suggests probing with stolen
  credentials. Successful calls mean encrypted passwords left the account: identify
  the instances and rotate their administrator passwords.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.credential-access.ec2-get-password-data/
author: Umair Haider
date: 2026-10-26
tags:
  - attack.credential-access
  - attack.t1552
correlation:
  type: value_count
  rules:
    - aws_ec2_getpassworddata_call
  group-by:
    - userIdentity.arn
  timespan: 2m
  condition:
    field: requestParameters.instanceId
    gte: 5
falsepositives:
  - Fleet automation that retrieves passwords for many Windows instances. Exclude that
    tool's specific role ARN rather than raising the threshold for everyone.
level: medium
